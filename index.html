<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IoM Theory</title>
<style>
  :root{--bg:#f6f7f9;--card:#ffffff;--fg:#1a1c22;--muted:#5b6370;--accent:#c0111f}
  @media (prefers-color-scheme:dark){
    :root{--bg:#101217;--card:#1a1e26;--fg:#f0f2f5;--muted:#9aa1ad;--accent:#f0708a}
  }
  body{margin:0;background:var(--bg);color:var(--fg);
    font:16px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif;
    padding:24px 16px 64px}
  main{max-width:680px;margin:0 auto;background:var(--card);border-radius:16px;
    padding:32px 28px;box-shadow:0 4px 24px rgba(0,0,0,.08)}
  h1{font-size:1.7em;margin:0 0 .2em}
  p{color:var(--muted)}
  .badge{display:inline-block;background:var(--accent);color:#fff;border-radius:99px;
    padding:3px 12px;font-size:.8em;font-weight:700;margin-bottom:14px}
  ul{list-style:none;padding:0}
  li a{display:block;padding:14px 16px;margin:10px 0;border-radius:12px;background:var(--bg);
    color:var(--fg);text-decoration:none;font-weight:600}
  li a:hover{outline:2px solid var(--accent)}
</style>
</head>
<body>
<main>
  <span class="badge">IoM Theory</span>
  <h1>IoM Theory</h1>
  <p>An offline study app for the Isle of Man driving theory test, with 389 questions, 50 lessons and mock exams in the real format.</p>
  <ul>
    <li><a href="support.html">Support &amp; FAQ →</a></li>
    <li><a href="privacy.html">Privacy policy →</a></li>
  </ul>
</main>
</body>
</html>
